name: Install ETSpy with poetry
description: Uses poetry and CUDA action to install ETSpy and its dependencies
inputs:
  python-version:
    type: string
    required: true
  with-cuda:
    default: false
    type: boolean
  cuda-version:
    default: "12"
    type: string
    required: false
  poetry-options:
    default: ""
    type: string
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup python interpreter
      uses: actions/setup-python@v5.2.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Setup poetry
      uses: abatilo/actions-poetry@v3.0.0
    - name: Install CUDA dependencies
      if: ${{ inputs.with-cuda == 'true' }}
      uses: Jimver/cuda-toolkit@v0.2.35
      with:
        method: network
        cuda: ${{ inputs.cuda-version == '13' && '13.2.0' || '12.4.1' }}
        sub-packages: '["cudart"]'
        non-cuda-sub-packages: '["libcufft"]'
    - name: Install ETSpy using poetry
      run: |
        OPTIONS="${{ inputs.poetry-options }}"
        if [ "${{ inputs.with-cuda }}" == "true" ]; then
          if [ "${{ inputs.cuda-version }}" == "13" ]; then
            OPTIONS="$OPTIONS --extras cuda13"
          else
            OPTIONS="$OPTIONS --extras cuda12"
          fi
        fi
        poetry install $OPTIONS
      shell: bash -el {0}