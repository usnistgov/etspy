name: CI
on: [push, pull_request]

env:
  # Set the Matplotlib backend to 'agg' to avoid issues with rendering plots
  # in headless environments during testing.
  MPLBACKEND: agg
  
jobs:
  format-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Run Checks
        run: |
          uv run isort . --check
          uv run ruff check

  conda-pytest:
    name: "conda pytest: (${{ matrix.python-version }}, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: [ format-checks ]
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.10", "3.13"]
        include:
          - os: "ubuntu-latest"
            python-version: "3.11"
          - os: "ubuntu-latest"
            python-version: "3.12"
    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v5
      - name: Install with conda
        uses: ./.github/actions/install-with-conda
        with:
          python-version: ${{ matrix.python-version }}
          macos: ${{ matrix.os == 'macos-latest' }}
      - name: Run docstring example tests
        run: pytest --doctest-modules --ignore=etspy/tests etspy/ 
      - name: Run full test suite
        id: full_conda_tests
        if: always()
        run: pytest etspy/tests/

  uv-pytest:
      name: "uv pytest: (${{ matrix.python-version }}, ${{ matrix.os }}, cuda${{ matrix.cuda-version}})"
      runs-on: ${{ matrix.os }}
      needs: [ format-checks ]
      strategy:
        fail-fast: false
        matrix:
          os: ["ubuntu-latest"]
          python-version: ["3.10", "3.11", "3.12", "3.13"]
          cuda-version: ["12", "13"]
      steps:
        - uses: actions/checkout@v5
        - name: Install uv
          uses: ./.github/actions/install-with-uv
          with:
            python-version: ${{ matrix.python-version }}
            with-cuda: ${{ matrix.os == 'ubuntu-latest' }}
            cuda-version: ${{ matrix.cuda-version }}
            uv-options: "--dev"

        - name: Run tests
          run: |
            uv run pytest --doctest-modules --ignore=etspy/tests etspy/ 
            uv run pytest etspy/tests/